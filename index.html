<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Downloading...</title>
</head>

<body>

<script>
window.onload = function () {
    const link = document.createElement("a");

    link.href = "Apartment-Catalogue.pdf";
    link.download = "Apartment-Catalogue.pdf";

    document.body.appendChild(link);
    link.click();
    link.remove();
};
</script>

</body>
</html>
